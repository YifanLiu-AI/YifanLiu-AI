<title id="title">ICRA 2026 LeHome Challenge November 2025–May 2026 · Ebtech-MIAA   Initial submission: global #2 · Final rank: global #17 Trained and evaluated policies including Diffusion Policy and X-VLA, selecting X-VLA based on compute cost and baseline success rates. Built an automated training/evaluation pipeline driven by closed-loop success rate, rather than training loss alone. At 30k steps and 60 evaluation episodes per configuration, max_num_transforms=0/1/2/3 yielded 76.67% / 86.67% / 80.00% / 78.33%. Independently developed a multi-round RFT data flywheel for saving successful rollouts, filtering trajectories, merging datasets, and retraining. With about 100 rollout trajectories, observed success-rate gains of 20% on the training set and 2% on the test set. Clustered successful episodes by completion time and reward to reduce duplicate data injection while retaining longer trajectories containing corrections.</title>
