<title id="title">ICRA 2027 · TwinPath Wrist June–September 2026 · Second author · Under review   Haitao Jiang, Yifan Liu, Yanbin Chang, Wei Zhang, Xiaogang Xiong, Hui Cheng† Independently built the teleoperation, data-collection, and imitation-learning workflows for UR5e, a custom wrist, and four end-effector configurations, supporting fixed-versus-enabled wrist comparisons. Integrated SpaceMouse control of UR5e, wuji-retargeting for the dexterous hand, and a senior lab member&#x27;s custom master wrist for the follower wrist. Combined stored hand gestures, keyboard control, saved key poses, and motion planning; reserved manual teleoperation for difficult subtasks. Added visualization and hand-temperature alerts. Inexperienced operators could collect over 40 successful demonstrations within half an hour. Tested camera inputs individually, then added perturbations and camera/state dropout during training; the retrained policy completed the pick test task.</title>
