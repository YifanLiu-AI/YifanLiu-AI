<title id="title">NeurIPS 2026 RoboSyn Challenge August–October 2026 · Competition in progress   Zepeng Lin, Yifan Liu, Wei Shan, Yinuo Ge, Muyang Li Trained π0.5 baselines for 10 bimanual tasks using four H100 GPUs and an RTX 4090; added sensors and subtask checks to diagnose low-success-rate tasks. Mixer Operating: traced press failures through raw demonstrations, normalization, and control. Removed 195 of 1,000 demonstrations incompatible with current joint limits and applied ISR-based bimanual frame selection, reducing training sampling points by about 77%. Historical optimization improved success rate from 83% to 93%; this is not an isolated ISR ablation. Item Assembly: let a planner take over after both objects were securely grasped, lifted, and aligned. Mapped object-space waypoints to end-effector targets using the current grasp transforms. In an initial comparison on 20 common scenarios, success increased from 1/20 to 15/20. Manipulate Pipette: added a downward waypoint correction for insufficient press stroke; evaluation on 20 fixed scenarios improved success rate from 75% to 90%.</title>
