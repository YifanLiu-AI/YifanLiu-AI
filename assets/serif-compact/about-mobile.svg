<title id="title">I&#x27;m a B.Eng. student in the School of Mechanical and Automotive Engineering, South China University of Technology (SCUT), with an expected graduation date of June 2028. My work focuses on robot learning, simulation-to-real workflows, and bimanual and dexterous manipulation. I build and evaluate policies, investigate task failures, and develop teleoperation and rollout-data pipelines.</title>
