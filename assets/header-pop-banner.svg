<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title description">
  <title id="title">Yifan Liu</title>
  <desc id="description">Rose gradient and halftone pop-art banner. Embodied AI, Bimanual Manipulation, Dexterous Manipulation.</desc>
  <defs>
    <linearGradient id="rose" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#51253E"/>
      <stop offset="0.48" stop-color="#873C55"/>
      <stop offset="1" stop-color="#D36C91"/>
    </linearGradient>
    <linearGradient id="fade"><stop stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <pattern id="dots" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <circle cx="3" cy="3" r="2.2" fill="#F8C5D7"/>
    </pattern>
    <pattern id="ink" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <circle cx="3" cy="3" r="2.4" fill="#412137"/>
    </pattern>
    <mask id="dot-fade"><rect width="330" height="220" fill="url(#fade)"/></mask>
    <clipPath id="bounds"><rect width="900" height="220" rx="8"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="900" height="220" fill="url(#rose)"/>
    <path d="M-65 36L104-31 251 180 62 265Z" fill="#F39CBE" opacity="0.12"/>
    <rect width="330" height="220" fill="url(#dots)" mask="url(#dot-fade)" opacity="0.5"/>
    <circle cx="873" cy="210" r="145" fill="url(#ink)" opacity="0.33"/>
    <path d="M792-48L921 82 888 114 760-16Z" fill="#FFD4DE" opacity="0.3"/>
    <path d="M775 38L782 59 804 65 783 72 778 95 771 73 750 66 771 59Z" fill="#F8CEDC" opacity="0.82"/>
    <circle cx="92" cy="167" r="22" fill="none" stroke="#F8CEDC" stroke-width="2" opacity="0.55"/>
    <circle cx="102" cy="158" r="22" fill="none" stroke="#F8CEDC" stroke-width="1" opacity="0.28"/>
    <text x="452" y="106" text-anchor="middle" fill="#402336" opacity="0.38" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="700" letter-spacing="-1.5">Yifan Liu</text>
    <text x="450" y="103" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, 'Times New Roman', serif" font-size="65" font-weight="700" letter-spacing="-1.5">Yifan Liu</text>
    <text x="450" y="147" text-anchor="middle" fill="#FFF5F8" font-family="Georgia, 'Times New Roman', serif" font-size="20">Embodied AI · Bimanual Manipulation · Dexterous Manipulation</text>
    <text x="450" y="181" text-anchor="middle" fill="#F5DCE5" font-family="Georgia, 'Times New Roman', serif" font-size="16">Undergraduate · South China University of Technology</text>
